# Push to main → check → deploy to Vercel production.
# Needs one repository secret: VERCEL_TOKEN (create at https://vercel.com/account/tokens).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_WsyjP6yYI30EPWWD7EdhXIdg
  VERCEL_PROJECT_ID: prj_o0lXg9ETSKg077jwzQ0tmeSlD9pI

jobs:
  check:
    name: Lint, types, guide schema
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run validate-guides

  deploy:
    name: Deploy to Vercel (production)
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Check for VERCEL_TOKEN
        id: gate
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN secret is not set; skipping deploy. Add it under Settings > Secrets and variables > Actions."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: 20
      - run: npm install --global vercel@latest
        if: steps.gate.outputs.skip != 'true'
      - name: Pull Vercel project settings
        if: steps.gate.outputs.skip != 'true'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build
        if: steps.gate.outputs.skip != 'true'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        id: deploy
        if: steps.gate.outputs.skip != 'true'
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
